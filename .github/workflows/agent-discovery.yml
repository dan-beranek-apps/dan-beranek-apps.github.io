name: Validate agent discovery catalogs

on:
  push:
    paths:
      - "discovery/**"
      - "scripts/generate_agent_discovery.py"
      - ".well-known/**"
      - ".github/workflows/agent-discovery.yml"
      - "index.html"
      - "metadata/**"
      - "scripts/generate_entity_identity.py"
      - "scripts/validate_structured_data.py"
  pull_request:
    paths:
      - "discovery/**"
      - "scripts/generate_agent_discovery.py"
      - ".well-known/**"
      - ".github/workflows/agent-discovery.yml"
      - "index.html"
      - "metadata/**"
      - "scripts/generate_entity_identity.py"
      - "scripts/validate_structured_data.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate generated manifests
        run: python scripts/generate_agent_discovery.py --check
      - name: Verify and validate Entity Registry JSON-LD projection
        run: python scripts/generate_entity_identity.py --check
      - name: Validate homepage structured data
        run: python scripts/validate_structured_data.py
