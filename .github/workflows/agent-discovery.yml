name: Validate agent discovery catalogs

on:
  push:
    paths:
      - "discovery/**"
      - "scripts/generate_agent_discovery.py"
      - ".well-known/**"
      - ".github/workflows/agent-discovery.yml"
  pull_request:
    paths:
      - "discovery/**"
      - "scripts/generate_agent_discovery.py"
      - ".well-known/**"
      - ".github/workflows/agent-discovery.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate generated manifests
        run: python scripts/generate_agent_discovery.py --check
