<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#080b12">
  <title>Planner typography preview — DIO Web Design System v0.1.1</title>
  <meta name="description" content="Private review surface for the DIO Web Design System typography pilot.">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #f7f8fb; }
    body { font: 14px/1.4 system-ui, sans-serif; color: #080b12; }
    .preview-bar {
      position: relative; z-index: 100;
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 8px 18px; min-height: 42px; padding: 7px 16px;
      background: #080b12; color: #fff; border-bottom: 1px solid #394254;
    }
    .preview-bar strong { font-size: 13px; letter-spacing: .04em; }
    .preview-bar span { color: #c6cdd9; }
    .preview-bar a { color: #b8caff; text-underline-offset: 3px; }
    .frame-wrap { height: calc(100vh - 42px); min-height: 500px; }
    iframe { display: block; width: 100%; height: 100%; border: 0; visibility: hidden; background: #f7f8fb; }
    .status { color: #d7deec; font-size: 12px; }
    @media (max-width: 600px) {
      .preview-bar { align-items: flex-start; flex-direction: column; gap: 3px; }
      .frame-wrap { height: calc(100vh - 65px); min-height: 500px; }
    }
  </style>
</head>
<body>
  <div class="preview-bar">
    <strong>TYPOGRAPHY PREVIEW · DIO WEB DESIGN SYSTEM 0.1.1</strong>
    <span>Review only — production CSS is unchanged. <a href="/agentic-entity-resolution-guardrail-planner/" target="_blank" rel="noopener">Open live Planner ↗</a></span>
    <span class="status" id="preview-status" aria-live="polite">Applying preview styles…</span>
  </div>
  <div class="frame-wrap">
    <iframe id="site-frame" title="Agentic Entity Resolution Guardrail Planner typography preview"></iframe>
  </div>
  <script>
    const coreCss = "/* DIO Web Design System — ready-to-vendor foundation\n * Version: 0.1.0 | No runtime imports, fonts, scripts or external requests.\n */\n:root {\n  --dio-color-ink: #080b12;\n  --dio-color-ink-soft: #121722;\n  --dio-color-paper: #f7f8fb;\n  --dio-color-white: #ffffff;\n  --dio-color-muted: #626a79;\n  --dio-color-muted-inverse: #aab2c2;\n  --dio-color-border: #d9dde6;\n  --dio-color-border-inverse: #2a3140;\n  --dio-color-accent: #154cff;\n  --dio-color-accent-strong: #0c35bd;\n  --dio-color-accent-soft: #e9efff;\n  --dio-color-accent-light: #8eabff;\n  --dio-color-text: #000000;\n  --dio-color-text-inverse: #ffffff;\n  --dio-color-text-secondary: #626a79;\n  --dio-font-sans: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, \"Segoe UI\", Arial, sans-serif;\n  --dio-font-serif: Georgia, \"Times New Roman\", serif;\n  --dio-font-size-body: 1rem;\n  --dio-font-size-reading: 0.9375rem;\n  --dio-font-size-compact: 0.875rem;\n  --dio-font-size-meta: 0.8125rem;\n  --dio-font-size-micro: 0.75rem;\n  --dio-line-height-body: 1.65;\n  --dio-line-height-compact: 1.5;\n  --dio-reading-measure: 68ch;\n  --dio-space-1: 0.25rem;\n  --dio-space-2: 0.5rem;\n  --dio-space-3: 0.75rem;\n  --dio-space-4: 1rem;\n  --dio-space-5: 1.5rem;\n  --dio-space-6: 2rem;\n  --dio-space-7: 3rem;\n  --dio-space-8: 4rem;\n  --dio-radius-sm: 0.25rem;\n  --dio-radius: 0.35rem;\n  --dio-radius-lg: 0.55rem;\n  --dio-shadow-soft: 0 18px 60px rgba(8, 11, 18, 0.08);\n  --dio-content-max: 1280px;\n}\n\n.dio-prose {\n  max-width: var(--dio-reading-measure);\n  color: var(--dio-color-text);\n  font-family: var(--dio-font-sans);\n  font-size: var(--dio-font-size-body);\n  line-height: var(--dio-line-height-body);\n  overflow-wrap: anywhere;\n}\n\n.dio-prose :where(p, li, dd, dt, blockquote, td, th) {\n  font-size: inherit;\n  line-height: inherit;\n}\n\n.dio-prose :where(p, ul, ol, blockquote, table) {\n  margin-block: 0 1em;\n}\n\n.dio-prose :where(h2, h3, h4) {\n  color: var(--dio-color-ink);\n  line-height: 1.2;\n}\n\n.dio-prose :where(a) {\n  color: var(--dio-color-accent-strong);\n  text-underline-offset: 0.2em;\n}\n\n.dio-prose :where(code, pre) {\n  overflow-wrap: anywhere;\n}\n\n.dio-prose :where(small, .dio-meta) {\n  font-size: var(--dio-font-size-meta);\n  line-height: var(--dio-line-height-compact);\n}\n";
    const typographyCss = "/* DIO Web Design System — Agentic ER Planner pilot\n * DIO-WDS version: 0.1.0\n * This layer adjusts text only. Layout, color, spacing, display heading scale,\n * component geometry and project-specific interactions remain in site.css.\n */\n\n/* Brand navigation and controls */\n.brand-copy,\n.primary-nav a,\n.mobile-menu nav a,\n.platform-link,\n.header-cta .platform-link,\n.text-link,\n.back-link,\n.method-publication a,\n.method-header-back,\n.reference-links a,\n.deliverable-list a,\n.footer-brand,\n.footer-links a {\n  font-size: var(--dio-font-size-compact);\n}\n.platform-name,\n.eyebrow,\n.hero-meta,\n.visual-caption,\n.signal-index,\n.card-kicker,\n.group-heading > span,\n.investigation-item > span,\n.workflow-number,\n.control-item span,\n.deliverable-list a > span:first-child,\n.audience-grid article > span,\n.footer-label,\n.footer-bottom,\n.demo-table th,\n.method-publication > span,\n.bibliography li::marker,\n.bibliography-author {\n  font-size: var(--dio-font-size-meta);\n}\n.visual-topline,\n.hero-stat-row span {\n  font-size: var(--dio-font-size-micro);\n}\n\n/* Supporting and explanatory copy */\n.affiliate-note,\n.micro-note,\n.comparison-footnote,\n.small-note,\n.integrity-note p,\n.boundary-bottom,\n.footer-main > div:first-child > p,\n.case-facts span,\n.method-header-back {\n  font-size: var(--dio-font-size-compact);\n}\n.signal-card p,\n.comparison-card ul,\n.boundary-card ul,\n.investigation-item p,\n.workflow-step p,\n.decision-band > p,\n.control-item p,\n.case-story > p:not(.card-kicker),\n.case-outcome p,\n.deliverable-intro > p:last-child,\n.audience-grid p,\n.demo-table td,\n.demo-caveat p,\n.bibliography-source,\n.research-resources li {\n  font-size: var(--dio-font-size-reading);\n}\n.case-outcome strong,\n.method-return .text-link {\n  font-size: var(--dio-font-size-reading);\n}\n.integrity-note strong {\n  font-size: var(--dio-font-size-compact);\n}\n\n/* Narrower desktop headers need a slightly more compact navigation row. */\n@media (max-width: 1080px) {\n  .primary-nav a {\n    font-size: var(--dio-font-size-meta);\n  }\n}\n\n/* The mobile rules in this layer intentionally keep the same reading sizes:\n   cards and table cells may grow vertically rather than shrinking text. */\n@media (max-width: 620px) {\n  .brand-copy,\n  .mobile-menu nav a,\n  .deliverable-list a,\n  .demo-table td {\n    font-size: var(--dio-font-size-compact);\n  }\n  .demo-table th {\n    font-size: var(--dio-font-size-meta);\n  }\n}\n\n\n/* Primary reading text on light surfaces: pure black by design.\n   Secondary metadata, dark surfaces and inverse text keep their own colors. */\nbody,\n.section-heading > p,\n.comparison-card > p:not(.card-kicker),\n.comparison-card ul,\n.workflow-step p,\n.decision-band > p,\n.case-story > p:not(.card-kicker),\n.case-outcome p,\n.deliverable-intro > p:last-child,\n.integrity-note p,\n.audience-grid p,\n.reference-grid p:not(.eyebrow),\n.demo-caveat p {\n  color: var(--dio-color-text);\n}\n";
    const frame = document.getElementById("site-frame");
    const status = document.getElementById("preview-status");

    function applyPreviewStyles() {
      try {
        const doc = frame.contentDocument;
        if (!doc || !doc.head) throw new Error("Planner preview document is not accessible.");
        if (!doc.getElementById("dio-preview-core")) {
          const core = doc.createElement("style");
          core.id = "dio-preview-core";
          core.textContent = coreCss;
          doc.head.appendChild(core);
        }
        if (!doc.getElementById("dio-preview-typography")) {
          const typography = doc.createElement("style");
          typography.id = "dio-preview-typography";
          typography.textContent = typographyCss;
          doc.head.appendChild(typography);
        }
        frame.style.visibility = "visible";
        status.textContent = "Preview styles active · main, methodology and demo navigation supported.";
      } catch (error) {
        frame.style.visibility = "visible";
        status.textContent = "Preview styling could not be applied: " + error.message;
      }
    }

    frame.addEventListener("load", applyPreviewStyles);
    frame.src = "/agentic-entity-resolution-guardrail-planner/";
  </script>
</body>
</html>
